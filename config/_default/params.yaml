hugoblox:
  schema: "2.0"
  identity:
    name: Dr. Tong Liu
    type: person
    tagline: "AI Researcher "
    description: Dr. Tong Liu is a dual Ph.D. graduate jointly trained by Macao Polytechnic University and the University of Coimbra
  theme:
    mode: light
    pack: minimal
    colors:
      primary: ""
      secondary: ""
      neutral: ""
  typography:
    font: native
    size: md
  layout:
    radius: full
    spacing: comfortable
    avatar_shape: circle
  header:
    enable: true
    style: navbar
    sticky: true
    align: center
    search: true
    theme_toggle: true
  footer:
    style: minimal
    language_switcher: true
  copyright:
    notice: © {year} {name}
  content:
    math:
      enable: false
    toc:
      enable: true
    reading_time:
      enable: true
    citations:
      style: apa
  search:
    enable: true
  locale:
    date_format: 2006-01-02
    time_format: 15:04
