{{ $block := .wcBlock }}
{{ $url := $block.content.share_url }}
<div class="mila-stats">
  <div class="mila-stats-header">
    <h2><span class="mila-stats-dot" aria-hidden="true"></span>{{ $block.content.title }}</h2>
    <a href="{{ $url }}" target="_blank" rel="noopener noreferrer">Full view ↗</a>
  </div>
  <details>
    <summary>View overview <span>Views · Sessions · Geography</span></summary>
    <p class="mila-stats-help">If the dashboard does not load, <a href="{{ $url }}" target="_blank" rel="noopener noreferrer">open the full view ↗</a>.</p>
    <iframe data-mila-stats-src="{{ $url }}" title="Mila's public website statistics" loading="lazy" referrerpolicy="strict-origin-when-cross-origin"></iframe>
  </details>
</div>
<style>
  .mila-stats{width:calc(100% - 2rem);max-width:1100px;margin:auto;padding:24px;border:1px solid #cbd5e1;border-radius:16px}
  .mila-stats-header{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:16px}
  .mila-stats-header h2{display:flex;align-items:center;gap:10px;margin:0;font-size:1.5rem;font-weight:700}
  .mila-stats a{color:#0d829d;text-decoration:none}.mila-stats a:hover{text-decoration:underline}
  .mila-stats-dot{width:9px;height:9px;display:inline-block;border-radius:50%;background:#22c55e}
  .mila-stats summary{cursor:pointer;font-weight:600;padding:12px 0}
  .mila-stats summary span{font-size:.85rem;font-weight:400;opacity:.7;margin-left:12px}
  .mila-stats-help{font-size:.85rem;opacity:.8;margin:8px 0 16px}
  .mila-stats iframe{display:block;width:100%;height:780px;border:0;border-radius:8px;background:#fff}
  @media(max-width:640px){.mila-stats{padding:16px}.mila-stats summary span{display:block;margin:6px 0 0}.mila-stats iframe{height:680px}}
</style>
<script>
  document.querySelectorAll('.mila-stats details').forEach(function (panel) {
    panel.addEventListener('toggle', function () {
      var frame = panel.querySelector('iframe');
      if (panel.open && !frame.hasAttribute('src')) {
        frame.src = frame.dataset.milaStatsSrc;
      }
    });
  });
</script>
